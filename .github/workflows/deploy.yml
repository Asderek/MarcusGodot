name: Deploy SotN Platformer to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    name: Export Web & Deploy to GitHub Pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create export directory
        run: mkdir -p build/web

      - name: Export Godot 4 Web Project
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          preset: "Web"
          archive_output: false

      - name: Add .nojekyll & Verify Files
        run: |
          touch build/web/.nojekyll
          echo "Checking build/web directory contents:"
          ls -la build/web/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
